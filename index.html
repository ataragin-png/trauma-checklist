<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>צ'קליסט חדר טראומה</title>
<meta name="robots" content="noindex">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Secular+One&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef2f3; --surface:#ffffff; --ink:#14212a; --muted:#5a6a74; --line:#d4dde1;
  --accent:#0d6876; --accent-ink:#ffffff; --accent-soft:#dcedef;
  --ok:#1d7446; --ok-bg:#e1f2e8; --warn:#9a5c00; --warn-bg:#fbefd9; --crit:#bd2329; --crit-bg:#fbe3e3;
  --f-display:"Secular One","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1519; --surface:#182126; --ink:#e4ebee; --muted:#93a3ac; --line:#2a363d;
  --accent:#4cb2c0; --accent-ink:#0b1a1e; --accent-soft:#163238;
  --ok:#4cc07f; --ok-bg:#15301f; --warn:#e3a53c; --warn-bg:#33270f; --crit:#f2625e; --crit-bg:#3a1819; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:12px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;line-height:1.2}
.brand .unit{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px}
nav.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:8px 6px 10px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--crit);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono)}
main .wrap{padding-block:18px 120px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.04em;color:var(--muted);margin:0;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.done{background:var(--ok)} .dot.overdue,.dot.never{background:var(--crit)}
.seg button[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--accent-ink)}
.statusline{font-size:14px;color:var(--muted);margin:0}
.statusline b{color:var(--ink);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.cab{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cab-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--accent-soft)}
.cab-h h3{color:var(--ink);font-size:15px;letter-spacing:0}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px;font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap;border-inline-start:4px solid transparent}
.row.s-ok{border-inline-start-color:var(--ok)} .row.s-missing{border-inline-start-color:var(--warn);background:var(--warn-bg)} .row.s-broken{border-inline-start-color:var(--crit);background:var(--crit-bg)}
.iname{min-width:0;flex:1 1 200px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--crit);border:1px solid var(--crit);border-radius:4px;padding:0 5px;margin-inline-start:6px;vertical-align:1px}
.qty{display:inline-block;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-inline-start:6px;vertical-align:1px;font-variant-numeric:tabular-nums}
.opts{display:flex;gap:4px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:600;min-width:58px}
.opts button[data-v="ok"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button[data-v="missing"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.opts button[data-v="broken"][aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#fff}
.cntrow{flex-basis:100%;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;flex-wrap:wrap}
.cntrow input,.pinrow input{width:80px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-variant-numeric:tabular-nums}
.pinrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pinrow input{width:140px;padding:9px 10px;border-radius:8px}
.submitbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}
.submitbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.progress{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 12px;font-size:13px}
.alert{border-radius:10px;padding:12px 14px;background:var(--crit-bg);color:var(--ink);border:1px solid var(--crit);display:flex;flex-direction:column;gap:4px}
.alert strong{color:var(--crit)}
.alert.okay{background:var(--ok-bg);border-color:var(--ok)} .alert.okay strong{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.stat .who{font-weight:600}
.pill{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.pill.done{background:var(--ok-bg);color:var(--ok)} .pill.overdue,.pill.never{background:var(--crit-bg);color:var(--crit)}
.pill.missing{background:var(--warn-bg);color:var(--warn)} .pill.broken{background:var(--crit-bg);color:var(--crit)}
.mono{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .main{min-width:0;flex:1 1 220px;display:flex;flex-direction:column;gap:2px}
.muted{color:var(--muted)}
.empty{color:var(--muted);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;font-weight:600;max-width:calc(100% - 32px)}
.toast.err{background:var(--crit);color:#fff}
@media (prefers-reduced-motion:no-preference){.row,.opts button{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>צ'קליסט חדר טראומה</h1><span class="unit" id="unit"></span></div>
  <nav class="tabs" id="tabs">
    <button data-view="nurses">אחיות</button>
    <button data-view="volunteers">בנות שירות</button>
    <button data-view="manager">מנהל <span class="badge" id="badge" hidden>0</span></button>
  </nav>
</div></header>
<main><div class="wrap" id="main">
  <div class="panel"><h2>טוען את רשימת הציוד…</h2><p class="empty">הרשימה והבדיקות האחרונות יופיעו כאן בעוד רגע.</p></div>
</div></main>
<div class="submitbar" id="submitbar" hidden><div class="wrap"><span class="progress" id="progress"></span><button class="btn" id="submit">שמירת בדיקה</button></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const FREQ={daily:{label:'יומית',days:1},weekly:{label:'שבועית',days:7},monthly:{label:'חודשית',days:31}};
const FREQ_ORDER=['daily','weekly','monthly'];
const TEAM={nurses:'אחיות',volunteers:'בנות שירות'};
const TYPE={missing:'חסר',broken:'תקול'};
const TZ='Asia/Jerusalem';
const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return''}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};

const S={loaded:false,error:'',items:[],last:{},openIssues:[],recent:[],isMgr:false,sheetUrl:'',unit:''};
let view=['nurses','volunteers','manager'].includes(store.get('view'))?store.get('view'):'nurses';
let staffPin=store.get('staffPin'),mgrPin=store.get('mgrPin');
const selFreq={nurses:null,volunteers:null};
const draft={},cnt={};
const st={name:store.get('checker'),note:'',pinDraft:'',mgrDraft:''};
let busy=false,pending=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey=d=>new Date(d).toLocaleDateString('en-CA',{timeZone:TZ});
const fmt=iso=>new Date(iso).toLocaleString('he-IL',{timeZone:TZ,weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const API_URL=(window.TRAUMA_CONFIG&&window.TRAUMA_CONFIG.apiUrl)||'';
const ARGS={getState:['mgrPin'],verifyPin:['pin'],submitCheck:null,resolveIssue:['mgrPin','id']};
async function api(fn,...args){
  if(!API_URL)throw new Error('האתר עדיין לא מחובר לגיליון הנתונים.');
  const body=ARGS[fn]?Object.fromEntries(ARGS[fn].map((k,i)=>[k,args[i]])):Object.assign({},args[0]);
  body.action=fn;
  let res;
  try{res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})}
  catch(e){throw new Error('אין חיבור לשרת. בדוק/י אינטרנט ונסה/י שוב.')}
  let j;try{j=await res.json()}catch(e){throw new Error('השרת החזיר תשובה לא תקינה. נסה/י שוב בעוד רגע.')}
  if(!j.ok)throw new Error(j.error||'הפעולה נכשלה.');
  return j.data;
}
const cleanErr=e=>String((e&&e.message)||e||'').replace(/^(Error|Exception|שגיאה):\s*/,'')||'הפעולה נכשלה. בדוק/י חיבור ונסה/י שוב.';

function teamItems(team,freq){return S.items.filter(i=>i.team===team&&(!freq||i.freq===freq))}
function teamFreqs(team){return FREQ_ORDER.filter(f=>S.items.some(i=>i.team===team&&i.freq===f))}
function combos(){const out=[];for(const t of Object.keys(TEAM))for(const f of teamFreqs(t))out.push([t,f]);return out}
function due(team,freq){
  const c=S.last[team+'|'+freq];
  if(!c)return{state:'never'};
  if(freq==='daily')return{state:dayKey(c.at)===dayKey(Date.now())?'done':'overdue',c};
  return{state:(Date.now()-new Date(c.at))/864e5<=FREQ[freq].days?'done':'overdue',c};
}
function alertCount(){return S.isMgr?S.openIssues.length+combos().filter(([t,f])=>due(t,f).state!=='done').length:0}
function qtyLine(x){if(x.type!=='missing')return'';const q=x.qty,f=x.found;
  if(f!=null&&q)return`יש ${f} מתוך ${q} · להשלים ${Math.max(0,q-f)}`;
  if(f!=null)return`יש ${f}`;if(q)return`תקן ${q}`;return''}

function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast'+(kind==='err'?' err':'');t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,4000)}

function apply(s){
  S.loaded=true;S.error='';S.items=s.items||[];S.last=s.last||{};S.unit=s.unit||'';S.isMgr=!!s.isMgr;
  S.openIssues=s.openIssues||[];S.recent=s.recent||[];S.sheetUrl=s.sheetUrl||'';
  if(mgrPin&&!S.isMgr){mgrPin='';store.set('mgrPin','')}
  scheduleRender();
}
function refresh(){return api('getState',mgrPin||'').then(apply).catch(e=>{if(!S.loaded){S.error=cleanErr(e);render()}})}

function scheduleRender(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#main')&&/INPUT|TEXTAREA/.test(a.tagName)){pending=true;return}
  render();
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending){pending=false;scheduleRender()}},0));

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view?'page':'false'));
  $('#unit').textContent=S.unit;
  const n=alertCount(),badge=$('#badge');badge.textContent=n;badge.hidden=!n;
  const main=$('#main');
  if(S.error&&!S.loaded){main.innerHTML=`<div class="panel"><h2>לא הצלחתי לטעון את הנתונים</h2><p class="empty">${esc(S.error)}</p><div><button class="btn" data-act="reload">ניסיון נוסף</button></div></div>`;$('#submitbar').hidden=true;return}
  if(!S.loaded){$('#submitbar').hidden=true;return}
  main.innerHTML=view==='manager'?managerView():checkView(view);
  $('#submitbar').hidden=view==='manager'||!selFreq[view];
  if(view!=='manager')updateProgress();
}

function checkView(team){
  const freqs=teamFreqs(team);
  if(!freqs.length)return`<div class="panel"><h2>אין עדיין פריטים לבדיקה של ${TEAM[team]}</h2><p class="empty">המנהל מוסיף פריטים בגיליון "ציוד".</p></div>`;
  if(!freqs.includes(selFreq[team]))selFreq[team]=freqs.find(f=>due(team,f).state!=='done')||freqs[0];
  const f=selFreq[team],key=team+'|'+f,d=draft[key]||{},ds=due(team,f);
  const status=ds.state==='never'?'<b>טרם בוצעה בדיקה '+FREQ[f].label+'.</b>':
    ds.state==='done'?`בוצעה <b>${fmt(ds.c.at)}</b> ע"י ${esc(ds.c.by)}`:
    `<b style="color:var(--crit)">באיחור.</b> בדיקה אחרונה ${fmt(ds.c.at)} ע"י ${esc(ds.c.by)}`;
  const groups=[],by={};
  for(const i of teamItems(team,f)){if(!by[i.cabinet]){by[i.cabinet]=[];groups.push(i.cabinet)}by[i.cabinet].push(i)}
  const pinUi=(staffPin||mgrPin)?`<p class="statusline">קוד המחלקה שמור במכשיר הזה. <button class="linkbtn" data-act="forgetpin">החלפת קוד</button></p>`:
    `<div class="field"><label for="spin">קוד מחלקה</label><input id="spin" type="password" inputmode="numeric" autocomplete="off" value="${esc(st.pinDraft)}" placeholder="מקבלים מהמנהל"></div>`;
  return`<section class="panel">
    <h2>בדיקת ${TEAM[team]}</h2>
    <div class="seg" role="group" aria-label="תדירות">${freqs.map(x=>`<button data-act="freq" data-f="${x}" aria-pressed="${x===f}"><span class="dot ${due(team,x).state}"></span>${FREQ[x].label}</button>`).join('')}</div>
    <p class="statusline">${status}</p>
    <div class="field"><label for="checker">שם הבודק/ת</label><input id="checker" autocomplete="name" value="${esc(st.name)}" placeholder="שם מלא"></div>
    ${pinUi}
  </section>
  ${groups.map(g=>`<section class="cab"><div class="cab-h"><h3>${esc(g)}</h3><button class="linkbtn" data-act="allok" data-cab="${esc(g)}">הכל תקין</button></div>
    ${by[g].map(i=>`<div class="row s-${d[i.id]||'none'}"><div class="iname">${esc(i.name)}${i.critical?'<span class="tag">קריטי</span>':''}${i.qty?`<span class="qty">תקן: ${i.qty}</span>`:''}</div>
      <div class="opts" role="group" aria-label="${esc(i.name)}">${['ok','missing','broken'].map(v=>`<button data-act="mark" data-id="${esc(i.id)}" data-v="${v}" aria-pressed="${d[i.id]===v}">${v==='ok'?'תקין':TYPE[v]}</button>`).join('')}</div>
      ${d[i.id]==='missing'?`<div class="cntrow"><label for="c-${esc(i.id)}">כמה יש בפועל?</label><input type="number" min="0" inputmode="numeric" class="cnt" id="c-${esc(i.id)}" data-id="${esc(i.id)}" value="${esc(cnt[key+'|'+i.id])}">${i.qty?`<span class="muted">מתוך ${i.qty}</span>`:''}</div>`:''}</div>`).join('')}
  </section>`).join('')}
  <section class="panel"><div class="field"><label for="note">הערות (לא חובה)</label><textarea id="note" placeholder="למשל: נשארו 2 טובוסים 7.5, הוזמנו מהמחסן">${esc(st.note)}</textarea></div></section>`;
}

function updateProgress(){
  const team=view,f=selFreq[team];if(!f)return;
  const list=teamItems(team,f),d=draft[team+'|'+f]||{};
  const marked=list.filter(i=>d[i.id]).length,probs=list.filter(i=>d[i.id]&&d[i.id]!=='ok').length;
  $('#progress').textContent=`${marked}/${list.length} סומנו`+(probs?` · ${probs} בעיות`:'');
  $('#submit').disabled=busy;$('#submit').textContent=busy?'שומר…':'שמירת בדיקה';
}

function managerView(){
  if(!S.isMgr)return`<section class="panel"><h2>כניסת מנהל</h2>
    <p class="statusline">לוח הבקרה מציג חוסרים, תקלות ובדיקות שלא בוצעו. הקוד נמצא בגיליון "הגדרות".</p>
    <div class="pinrow"><label for="mpin" class="muted">קוד מנהל</label><input id="mpin" type="password" inputmode="numeric" autocomplete="off" value="${esc(st.mgrDraft)}"><button class="btn" data-act="login">כניסה</button></div></section>`;
  const open=S.openIssues,cs=combos(),late=cs.filter(([t,f])=>due(t,f).state!=='done');
  const banner=(open.length||late.length)?`<div class="alert"><strong>${open.length?open.length+' פריטים דורשים השלמה או תיקון':''}${open.length&&late.length?' · ':''}${late.length?late.length+' בדיקות לא בוצעו בזמן':''}</strong><span class="muted">פרטים למטה.</span></div>`:
    `<div class="alert okay"><strong>הכל תקין</strong><span class="muted">כל הבדיקות בוצעו בזמן ואין חוסרים פתוחים.</span></div>`;
  const stats=cs.length?`<div class="grid">${cs.map(([t,f])=>{const s=due(t,f);return`<div class="stat"><span class="who">${TEAM[t]} · ${FREQ[f].label}</span>
    <span class="pill ${s.state}">${s.state==='done'?'בוצעה':s.state==='never'?'טרם בוצעה':'באיחור'}</span>
    <span class="mono">${s.c?fmt(s.c.at)+' · '+esc(s.c.by):'—'}</span></div>`}).join('')}</div>`:'<p class="empty">אין עדיין פריטים ברשימה.</p>';
  const issueList=open.length?`<div class="list">${open.map(x=>`<div class="li"><div class="main"><span><b>${esc(x.itemName)}</b> <span class="pill ${x.type}">${TYPE[x.type]}</span></span>
      ${qtyLine(x)?`<span><b>${qtyLine(x)}</b></span>`:''}<span class="muted">${esc(x.cabinet)} · דווח ע"י ${esc(x.by)}${x.team?' ('+TEAM[x.team]+')':''}</span>${x.note?`<span class="muted">"${esc(x.note)}"</span>`:''}<span class="mono">${fmt(x.at)}</span></div>
      <button class="btn small" data-act="resolve" data-id="${esc(x.id)}">הושלם</button></div>`).join('')}</div>`:'<p class="empty">אין חוסרים או תקלות פתוחים.</p>';
  const recentList=S.recent.length?`<div class="list">${S.recent.map(c=>`<div class="li"><div class="main"><span><b>${TEAM[c.team]}</b> · בדיקה ${FREQ[c.freq].label} · ${esc(c.by)}</span>${c.notes?`<span class="muted">"${esc(c.notes)}"</span>`:''}</div>
      <span class="mono">${fmt(c.at)} · ${c.problemCount?`<span style="color:var(--crit)">${c.problemCount} בעיות</span>`:'תקין'}</span></div>`).join('')}</div>`:'<p class="empty">עוד לא נשמרו בדיקות. בדיקה ראשונה תופיע כאן ברגע שתישמר.</p>';
  return`${banner}
  <section class="panel"><h2>סטטוס בדיקות</h2>${stats}</section>
  <section class="panel"><h2>להשלמה ולתיקון</h2>${issueList}</section>
  <section class="panel"><h2>בדיקות אחרונות</h2>${recentList}</section>
  <section class="panel"><h2>רשימת הציוד והתקנים</h2>
    <p class="statusline">מוסיפים, מוחקים ומשנים פריטים, ארונות, תדירות וכמות תקן ישירות בגיליון "ציוד". השינוי מופיע כאן אחרי רענון.</p>
    <div class="actions">${S.sheetUrl?`<a class="btn ghost" href="${esc(S.sheetUrl)}" target="_blank" rel="noopener">פתיחת הגיליון</a>`:''}<button class="btn ghost" data-act="reload">רענון</button><button class="linkbtn" data-act="logout">יציאה ממצב מנהל</button></div>
  </section>`;
}

document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.view;store.set('view',view);render();window.scrollTo(0,0)});
document.getElementById('main').addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='checker'){st.name=t.value;store.set('checker',st.name)}
  else if(t.id==='note')st.note=t.value;
  else if(t.id==='spin')st.pinDraft=t.value;
  else if(t.id==='mpin')st.mgrDraft=t.value;
  else if(t.classList.contains('cnt'))cnt[view+'|'+selFreq[view]+'|'+t.dataset.id]=t.value;
});
document.getElementById('main').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mpin'){e.preventDefault();login()}});

async function login(){
  const pin=st.mgrDraft.trim();if(!pin){toast('יש להזין קוד מנהל','err');return}
  try{
    const r=await api('verifyPin',pin);
    if(r!=='manager'){toast('קוד המנהל שגוי','err');return}
    mgrPin=pin;store.set('mgrPin',pin);st.mgrDraft='';
    document.activeElement&&document.activeElement.blur();
    apply(await api('getState',mgrPin));
  }catch(err){toast(cleanErr(err),'err')}
}

document.getElementById('main').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='freq'){selFreq[view]=b.dataset.f;render();return}
  if(act==='mark'||act==='allok'){
    const key=view+'|'+selFreq[view];draft[key]=draft[key]||{};
    if(act==='mark'){const cur=draft[key][b.dataset.id];draft[key][b.dataset.id]=cur===b.dataset.v?undefined:b.dataset.v}
    else teamItems(view,selFreq[view]).filter(i=>i.cabinet===b.dataset.cab).forEach(i=>{if(!draft[key][i.id])draft[key][i.id]='ok'});
    const y=window.scrollY;render();window.scrollTo(0,y);return;
  }
  if(act==='forgetpin'){staffPin='';store.set('staffPin','');render();return}
  if(act==='reload'){b.disabled=true;await refresh();b.disabled=false;toast('עודכן');return}
  if(act==='login'){login();return}
  if(act==='logout'){mgrPin='';store.set('mgrPin','');S.isMgr=false;S.openIssues=[];render();return}
  if(act==='resolve'){b.disabled=true;try{apply(await api('resolveIssue',mgrPin,b.dataset.id));toast('סומן כהושלם')}catch(err){b.disabled=false;toast(cleanErr(err),'err')}}
});

document.getElementById('submit').addEventListener('click',async()=>{
  const team=view,f=selFreq[team];if(!f||busy)return;
  const list=teamItems(team,f),key=team+'|'+f,d=draft[key]||{},name=st.name.trim();
  if(!name){toast('יש להזין שם בודק/ת','err');const el=$('#checker');if(el)el.focus();return}
  const pin=staffPin||mgrPin||st.pinDraft.trim();
  if(!pin){toast('יש להזין קוד מחלקה','err');const el=$('#spin');if(el)el.focus();return}
  const left=list.filter(i=>!d[i.id]).length;
  if(left){toast(`נשארו ${left} פריטים לא מסומנים`,'err');return}
  const results={},found={};
  list.forEach(i=>{results[i.id]=d[i.id];const v=cnt[key+'|'+i.id];if(d[i.id]==='missing'&&v!=null&&String(v).trim()!=='')found[i.id]=Number(v)});
  const probs=list.filter(i=>d[i.id]!=='ok').length;
  busy=true;updateProgress();
  try{
    const s=await api('submitCheck',{pin,mgrPin:mgrPin||'',team,freq:f,by:name,notes:st.note,results,found});
    if(!staffPin&&!mgrPin){staffPin=pin;store.set('staffPin',pin)}
    st.pinDraft='';draft[key]={};st.note='';Object.keys(cnt).forEach(k=>{if(k.startsWith(key+'|'))delete cnt[k]});
    busy=false;apply(s);render();window.scrollTo(0,0);
    toast(probs?`הבדיקה נשמרה. ${probs} דיווחים נשלחו למנהל`:'הבדיקה נשמרה. הכל תקין');
  }catch(err){
    busy=false;const m=cleanErr(err);
    if(/קוד/.test(m)&&staffPin){staffPin='';store.set('staffPin','');render()}
    updateProgress();toast(m,'err');
  }
});

setInterval(()=>{if(document.visibilityState==='visible'&&!busy)refresh()},90000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.loaded)refresh()});
render();refresh();
</script>
</body>
</html>
