<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>צ'קליסט חדר טראומה</title>
<meta name="robots" content="noindex">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Secular+One&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef2f3; --surface:#ffffff; --ink:#14212a; --muted:#5a6a74; --line:#d4dde1;
  --accent:#0d6876; --accent-ink:#ffffff; --accent-soft:#dcedef;
  --ok:#1d7446; --ok-bg:#e1f2e8; --warn:#9a5c00; --warn-bg:#fbefd9; --crit:#bd2329; --crit-bg:#fbe3e3;
  --f-display:"Secular One","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1519; --surface:#182126; --ink:#e4ebee; --muted:#93a3ac; --line:#2a363d;
  --accent:#4cb2c0; --accent-ink:#0b1a1e; --accent-soft:#163238;
  --ok:#4cc07f; --ok-bg:#15301f; --warn:#e3a53c; --warn-bg:#33270f; --crit:#f2625e; --crit-bg:#3a1819; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:12px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;line-height:1.2}
.brand .unit{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px}
nav.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:8px 6px 10px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--crit);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono)}
main .wrap{padding-block:18px 120px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.04em;color:var(--muted);margin:0;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.done{background:var(--ok)} .dot.overdue,.dot.never{background:var(--crit)}
.seg button[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--accent-ink)}
.statusline{font-size:14px;color:var(--muted);margin:0}
.statusline b{color:var(--ink);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.cab{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cab-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--accent-soft)}
.cab-h h3{color:var(--ink);font-size:15px;letter-spacing:0}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px;font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap;border-inline-start:4px solid transparent}
.row.s-ok{border-inline-start-color:var(--ok)} .row.s-missing{border-inline-start-color:var(--warn);background:var(--warn-bg)} .row.s-broken{border-inline-start-color:var(--crit);background:var(--crit-bg)}
.iname{min-width:0;flex:1 1 200px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--crit);border:1px solid var(--crit);border-radius:4px;padding:0 5px;margin-inline-start:6px;vertical-align:1px}
.qty{display:inline-block;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-inline-start:6px;vertical-align:1px;font-variant-numeric:tabular-nums}
.opts{display:flex;gap:4px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:600;min-width:58px}
.opts button[data-v="ok"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button[data-v="missing"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.opts button[data-v="broken"][aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#fff}
.cntrow{flex-basis:100%;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;flex-wrap:wrap}
.cntrow input,.pinrow input{width:80px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-variant-numeric:tabular-nums}
.pinrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pinrow input{width:140px;padding:9px 10px;border-radius:8px}
.submitbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}
.submitbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.progress{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 12px;font-size:13px}
.alert{border-radius:10px;padding:12px 14px;background:var(--crit-bg);color:var(--ink);border:1px solid var(--crit);display:flex;flex-direction:column;gap:4px}
.alert strong{color:var(--crit)}
.alert.okay{background:var(--ok-bg);border-color:var(--ok)} .alert.okay strong{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.stat .who{font-weight:600}
.pill{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.pill.done{background:var(--ok-bg);color:var(--ok)} .pill.overdue,.pill.never{background:var(--crit-bg);color:var(--crit)}
.pill.missing{background:var(--warn-bg);color:var(--warn)} .pill.broken{background:var(--crit-bg);color:var(--crit)}
.mono{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .main{min-width:0;flex:1 1 220px;display:flex;flex-direction:column;gap:2px}
.muted{color:var(--muted)}
.empty{color:var(--muted);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.devid{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed}
.cnt-chip{font-size:12px;font-weight:600;color:var(--muted);margin-inline-start:8px;letter-spacing:0}
.cnt-chip.short{color:var(--crit)}
.row.s-repair{background:var(--bg);color:var(--muted)}
.pill.repair{background:var(--warn-bg);color:var(--warn)}
.opts button[data-v="found"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ohead,.orow{display:grid;grid-template-columns:minmax(0,1fr) 44px 72px 60px;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.ohead{font-size:12px;color:var(--muted);font-weight:600;padding-block:6px}
.orow input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 4px;font-variant-numeric:tabular-nums;text-align:center}
.num{text-align:center;font-variant-numeric:tabular-nums}
.toorder{font-weight:700;color:var(--muted)} .toorder.pos{color:var(--warn)}
.formrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.formrow select,.formrow input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;flex:1 1 200px}
.scanbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn.scan{display:inline-flex;align-items:center;gap:8px}
.btn.scan svg{width:20px;height:20px}
.scanov{position:fixed;inset:0;z-index:30;background:#0b1114;color:#eef2f3;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px}
.scanov h2{color:#eef2f3}
.scanov .top{position:static;background:none;border:0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.scanov .close{background:#22303a;color:#eef2f3;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
#reader{width:100%;max-width:520px;margin:0 auto;border-radius:12px;overflow:hidden;background:#000;min-height:220px}
#reader video{width:100%!important;height:auto!important;display:block}
.scanmsg{max-width:520px;margin:0 auto;width:100%;border-radius:10px;padding:12px 14px;font-weight:700;background:#22303a;min-height:48px}
.scanmsg.ok{background:#1d7446;color:#fff} .scanmsg.bad{background:#bd2329;color:#fff} .scanmsg.warn{background:#9a5c00;color:#fff}
.scanman{max-width:520px;margin:0 auto;width:100%;display:flex;gap:8px}
.scanman input{flex:1;min-width:0;background:#182126;color:#eef2f3;border:1px solid #2a363d;border-radius:8px;padding:9px 10px;direction:ltr;text-align:right}
.scancount{max-width:520px;margin:0 auto;width:100%;color:#93a3ac;font-size:14px}
.chkrow{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.chkrow label{display:flex;align-items:center;gap:6px}
.formcol{display:flex;flex-direction:column;gap:8px}
.formcol select,.formcol textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.formcol textarea{min-height:72px;resize:vertical}
.hint{font-size:13px;color:var(--warn);font-weight:600;margin:0}
.retrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1 1 100%}
.retrow input{flex:1 1 180px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
details.dev{border-top:1px solid var(--line);padding:10px 0}
details.dev:first-child{border-top:0}
details.dev summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.dev summary::-webkit-details-marker{display:none}
.tl{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-inline-start:12px;border-inline-start:2px solid var(--line)}
.tl .ev{display:flex;flex-direction:column;gap:2px}
.cntbadge{min-width:28px;text-align:center;font-family:var(--f-mono);font-weight:700;border-radius:999px;padding:2px 8px;background:var(--warn-bg);color:var(--warn)}
.devcard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important;color:#000!important}
  body>*:not(#print){display:none!important}
  #print{display:block;font-family:var(--f-body);color:#000}
  #print h1{font-family:var(--f-display);font-weight:400;font-size:20pt;margin:0 0 2mm}
  #print .meta{font-size:10pt;margin:0 0 5mm;color:#333}
  #print table{width:100%;border-collapse:collapse;font-size:11pt}
  #print th{text-align:right;border-bottom:1.5pt solid #000;padding:2mm;font-size:9pt}
  #print td{border-bottom:.5pt solid #999;padding:2mm;vertical-align:middle}
  #print tr{break-inside:avoid}
  #print td.q{font-size:16pt;font-weight:700;text-align:center;white-space:nowrap}
  #print td.bc{text-align:center;width:62mm}
  #print td.bc svg{max-width:60mm;height:auto}
  #print td.box{width:8mm}
  #print td.box span{display:inline-block;width:5mm;height:5mm;border:1pt solid #000}
  #print .nobc{font-family:var(--f-mono);font-size:10pt;color:#a00}
  #print .foot{margin-top:5mm;font-size:9pt;color:#444}
}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
details.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
details.item[open]{border-color:var(--accent)}
details.item summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.item summary::-webkit-details-marker{display:none}
details.item summary .nm{font-weight:600;min-width:0}
.src{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.src.none{background:var(--bg);color:var(--muted)}
dl.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:12px 0 0}
dl.facts dt{color:var(--muted);font-size:13px;font-weight:600}
dl.facts dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
dl.facts dd.where{font-weight:700;color:var(--accent)}
.bcbox{margin-top:10px;background:#fff;border-radius:8px;padding:8px;display:inline-block;max-width:100%}
.bcbox svg{max-width:100%;height:auto;display:block}
.info{background:none;border:1px solid var(--line);color:var(--accent);border-radius:50%;width:22px;height:22px;font-size:12px;font-weight:700;cursor:pointer;margin-inline-start:6px;vertical-align:1px;line-height:1;padding:0;font-family:var(--f-body)}
.catlist{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-weight:600;max-width:calc(100% - 32px)}
.toast.err{background:var(--crit);color:#fff}
@media (prefers-reduced-motion:no-preference){.row,.opts button{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>צ'קליסט חדר טראומה</h1><span class="unit" id="unit"></span></div>
  <nav class="tabs" id="tabs">
    <button data-view="nurses">אחיות</button>
    <button data-view="volunteers">בנות שירות</button>
    <button data-view="catalog">פריטים</button>
    <button data-view="manager">מנהל <span class="badge" id="badge" hidden>0</span></button>
  </nav>
</div></header>
<main><div class="wrap" id="main">
  <div class="panel"><h2>טוען את רשימת הציוד…</h2><p class="empty">הרשימה והבדיקות האחרונות יופיעו כאן בעוד רגע.</p></div>
</div></main>
<div class="submitbar" id="submitbar" hidden><div class="wrap"><span class="progress" id="progress"></span><button class="btn" id="submit">שמירת בדיקה</button></div></div>
<div class="toast" id="toast" hidden></div>
<div id="print" aria-hidden="true"></div>
<div class="scanov" id="scanov" hidden role="dialog" aria-modal="true" aria-labelledby="scantitle">
  <div class="top"><h2 id="scantitle">סריקת ברקוד</h2><button class="close" id="scanclose">סגירה</button></div>
  <div id="reader"></div>
  <div class="scanmsg" id="scanmsg" aria-live="polite">מכוונים את המצלמה לברקוד שעל המדבקה.</div>
  <div class="scancount" id="scancount"></div>
  <div class="scanman"><input id="scanmanual" inputmode="text" autocomplete="off" placeholder="או הקלדת מספר הזיהוי"><button class="close" id="scanmanbtn">אישור</button></div>
</div>

<script>
const FREQ={devices:{label:'מכשור רפואי – יומי',days:1,daily:true},daily:{label:'ציוד – יומי',days:1,daily:true},order:{label:'הזמנה שבועית',days:7},weekly:{label:'ציוד – שבועי',days:7},monthly:{label:'ציוד – חודשי',days:31}};
const FREQ_ORDER=['devices','daily','order','weekly','monthly'];
const TEAM={nurses:'אחיות',volunteers:'בנות שירות'};
const TYPE={missing:'חסר',broken:'תקול'};
const TZ='Asia/Jerusalem';
const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return''}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};

const S={loaded:false,error:'',items:[],last:{},openIssues:[],recent:[],isMgr:false,sheetUrl:'',unit:'',devices:[],devTypes:{},consumables:[],repairs:[],lastOrder:null,repairHistory:{},catalog:[]};
let view=['nurses','volunteers','catalog','manager'].includes(store.get('view'))?store.get('view'):'nurses';
let staffPin=store.get('staffPin'),mgrPin=store.get('mgrPin');
const selFreq={nurses:null,volunteers:null};
const draft={},cnt={};
const st={name:store.get('checker'),note:'',pinDraft:'',mgrDraft:'',rdev:'',rreason:'',rnote:{},hq:'',nd:{id:'',type:'',loc:'',vol:false,clean:false},rq:'',cq:'',csrc:'',copen:'',ni:{name:'',sku:'',barcode:'',unit:'',source:'',desc:'',howto:'',location:''}};
let busy=false,pending=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey=d=>new Date(d).toLocaleDateString('en-CA',{timeZone:TZ});
const fmt=iso=>new Date(iso).toLocaleString('he-IL',{timeZone:TZ,weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const API_URL=(window.TRAUMA_CONFIG&&window.TRAUMA_CONFIG.apiUrl)||'';
const ARGS={getState:['mgrPin'],verifyPin:['pin'],submitCheck:null,submitDeviceCheck:null,submitOrder:null,resolveIssue:['mgrPin','id'],addDevice:['mgrPin','device'],addCatalogItem:['mgrPin','item'],sendToRepair:['mgrPin','deviceId','reason'],returnFromRepair:['mgrPin','deviceId','note']};
async function api(fn,...args){
  if(!API_URL)throw new Error('האתר עדיין לא מחובר לגיליון הנתונים.');
  const body=ARGS[fn]?Object.fromEntries(ARGS[fn].map((k,i)=>[k,args[i]])):Object.assign({},args[0]);
  body.action=fn;
  let res;
  try{res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})}
  catch(e){throw new Error('אין חיבור לשרת. בדוק/י אינטרנט ונסה/י שוב.')}
  let j;try{j=await res.json()}catch(e){throw new Error('השרת החזיר תשובה לא תקינה. נסה/י שוב בעוד רגע.')}
  if(!j.ok)throw new Error(j.error||'הפעולה נכשלה.');
  return j.data;
}
const cleanErr=e=>String((e&&e.message)||e||'').replace(/^(Error|Exception|שגיאה):\s*/,'')||'הפעולה נכשלה. בדוק/י חיבור ונסה/י שוב.';

function teamItems(team,freq){return S.items.filter(i=>i.team===team&&(!freq||i.freq===freq))}
function teamFreqs(team){return FREQ_ORDER.filter(f=>{
  if(f==='devices')return team==='volunteers'&&S.devices.some(d=>d.vol);
  if(f==='order')return team==='volunteers'&&S.consumables.length>0;
  return S.items.some(i=>i.team===team&&i.freq===f)})}
const volDevices=()=>S.devices.filter(x=>x.vol);
const filled=v=>v!=null&&String(v).trim()!=='';
function orderQty(c,v){if(!filled(v)||c.qty==null)return null;return Math.max(0,c.qty-Math.max(0,Math.round(Number(v))))}
function combos(){const out=[];for(const t of Object.keys(TEAM))for(const f of teamFreqs(t))out.push([t,f]);return out}
function due(team,freq){
  const c=S.last[team+'|'+freq];
  if(!c)return{state:'never'};
  if(FREQ[freq].daily)return{state:dayKey(c.at)===dayKey(Date.now())?'done':'overdue',c};
  return{state:(Date.now()-new Date(c.at))/864e5<=FREQ[freq].days?'done':'overdue',c};
}
function alertCount(){return S.isMgr?S.openIssues.length+combos().filter(([t,f])=>due(t,f).state!=='done').length:0}
function qtyLine(x){if(x.type!=='missing')return'';const q=x.qty,f=x.found;
  if(f!=null&&q)return`יש ${f} מתוך ${q} · להשלים ${Math.max(0,q-f)}`;
  if(f!=null)return`יש ${f}`;if(q)return`תקן ${q}`;return''}

function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast'+(kind==='err'?' err':'');t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,4000)}

function apply(s){
  S.loaded=true;S.error='';S.items=s.items||[];S.last=s.last||{};S.unit=s.unit||'';S.isMgr=!!s.isMgr;
  S.openIssues=s.openIssues||[];S.recent=s.recent||[];S.sheetUrl=s.sheetUrl||'';
  S.devices=s.devices||[];S.devTypes=s.devTypes||{};S.consumables=s.consumables||[];S.repairs=s.repairs||[];S.lastOrder=s.lastOrder||null;S.repairHistory=s.repairHistory||{};S.catalog=s.catalog||[];
  if(mgrPin&&!S.isMgr){mgrPin='';store.set('mgrPin','')}
  scheduleRender();
}
function refresh(){return api('getState',mgrPin||'').then(apply).catch(e=>{if(!S.loaded){S.error=cleanErr(e);render()}})}

function scheduleRender(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#main')&&/INPUT|TEXTAREA/.test(a.tagName)){pending=true;return}
  render();
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending){pending=false;scheduleRender()}},0));

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view?'page':'false'));
  $('#unit').textContent=S.unit;
  const n=alertCount(),badge=$('#badge');badge.textContent=n;badge.hidden=!n;
  const main=$('#main');
  if(S.error&&!S.loaded){main.innerHTML=`<div class="panel"><h2>לא הצלחתי לטעון את הנתונים</h2><p class="empty">${esc(S.error)}</p><div><button class="btn" data-act="reload">ניסיון נוסף</button></div></div>`;$('#submitbar').hidden=true;return}
  if(!S.loaded){$('#submitbar').hidden=true;return}
  main.innerHTML=view==='manager'?managerView():view==='catalog'?catalogView():checkView(view);
  $('#submitbar').hidden=view==='manager'||view==='catalog'||!selFreq[view];
  if(view!=='manager'&&view!=='catalog')updateProgress();
  if(view==='catalog')drawCatBarcodes();
}

function checkView(team){
  const freqs=teamFreqs(team);
  if(!freqs.length)return`<div class="panel"><h2>אין עדיין פריטים לבדיקה של ${TEAM[team]}</h2><p class="empty">המנהל מוסיף פריטים בגיליון "ציוד".</p></div>`;
  if(!freqs.includes(selFreq[team]))selFreq[team]=freqs.find(f=>due(team,f).state!=='done')||freqs[0];
  const f=selFreq[team],key=team+'|'+f,d=draft[key]||{},ds=due(team,f);
  const status=ds.state==='never'?'<b>טרם בוצע: '+FREQ[f].label+'.</b>':
    ds.state==='done'?`בוצעה <b>${fmt(ds.c.at)}</b> ע"י ${esc(ds.c.by)}`:
    `<b style="color:var(--crit)">באיחור.</b> בדיקה אחרונה ${fmt(ds.c.at)} ע"י ${esc(ds.c.by)}`;
  const pinUi=(staffPin||mgrPin)?`<p class="statusline">קוד המחלקה שמור במכשיר הזה. <button class="linkbtn" data-act="forgetpin">החלפת קוד</button></p>`:
    `<div class="field"><label for="spin">קוד מחלקה</label><input id="spin" type="password" inputmode="numeric" autocomplete="off" value="${esc(st.pinDraft)}" placeholder="מקבלים מהמנהל"></div>`;
  return`<section class="panel">
    <h2>${TEAM[team]}</h2>
    <div class="seg" role="group" aria-label="תדירות">${freqs.map(x=>`<button data-act="freq" data-f="${x}" aria-pressed="${x===f}"><span class="dot ${due(team,x).state}"></span>${FREQ[x].label}</button>`).join('')}</div>
    <p class="statusline">${status}</p>
    ${f==='order'?'<p class="statusline">ממלאים כמה יש במלאי מכל פריט. הכמות להזמנה מחושבת לבד: תקן פחות מלאי.</p>':f==='devices'?'<p class="statusline">מסמנים לכל מכשיר אם הוא נמצא במקומו. מכשיר בתיקון מסומן אוטומטית.</p>':''}
    <div class="field"><label for="checker">שם הבודק/ת</label><input id="checker" autocomplete="name" value="${esc(st.name)}" placeholder="שם מלא"></div>
    ${pinUi}
  </section>
  ${f==='devices'?devicesBody(key,d):f==='order'?orderBody(key):genericBody(team,f,key,d)}
  <section class="panel"><div class="field"><label for="note">הערות (לא חובה)</label><textarea id="note" placeholder="${f==='order'?'למשל: צריך גם כפפות L בדחיפות':'למשל: נשארו 2 טובוסים 7.5, הוזמנו מהמחסן'}">${esc(st.note)}</textarea></div></section>`;
}

function genericBody(team,f,key,d){
  const groups=[],by={};
  for(const i of teamItems(team,f)){if(!by[i.cabinet]){by[i.cabinet]=[];groups.push(i.cabinet)}by[i.cabinet].push(i)}
  return`${groups.map(g=>`<section class="cab"><div class="cab-h"><h3>${esc(g)}</h3><button class="linkbtn" data-act="allok" data-cab="${esc(g)}">הכל תקין</button></div>
    ${by[g].map(i=>`<div class="row s-${d[i.id]||'none'}"><div class="iname">${esc(i.name)}${infoBtn({name:i.name})}${i.critical?'<span class="tag">קריטי</span>':''}${i.qty?`<span class="qty">תקן: ${i.qty}</span>`:''}</div>
      <div class="opts" role="group" aria-label="${esc(i.name)}">${['ok','missing','broken'].map(v=>`<button data-act="mark" data-id="${esc(i.id)}" data-v="${v}" aria-pressed="${d[i.id]===v}">${v==='ok'?'תקין':TYPE[v]}</button>`).join('')}</div>
      ${d[i.id]==='missing'?`<div class="cntrow"><label for="c-${esc(i.id)}">כמה יש בפועל?</label><input type="number" min="0" inputmode="numeric" class="cnt" id="c-${esc(i.id)}" data-id="${esc(i.id)}" value="${esc(cnt[key+'|'+i.id])}">${i.qty?`<span class="muted">מתוך ${i.qty}</span>`:''}</div>`:''}</div>`).join('')}
  </section>`).join('')}`;
}

function devicesBody(key,d){
  const types=[],by={};
  volDevices().forEach(x=>{if(!by[x.type]){by[x.type]=[];types.push(x.type)}by[x.type].push(x)});
  const loc=x=>x.location?` <span class="muted">· ${esc(x.location)}</span>`:'';
  const act=volDevices().filter(x=>x.status==='active'),nf=act.filter(x=>d[x.id]==='found').length;
  return`<section class="panel scanbar"><span class="statusline">סורקים כל מכשיר, והוא מסומן "נמצא" לבד. <b>${nf}/${act.length}</b></span><button class="btn scan" data-act="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>סריקת ברקוד</button></section>`+types.map(t=>{
    const list=by[t],req=S.devTypes[t],act=list.filter(x=>x.status==='active');
    const found=act.filter(x=>d[x.id]==='found').length,rep=list.length-act.length,done=act.every(x=>d[x.id]);
    const short=req!=null&&done&&found<req;
    return`<section class="cab"><div class="cab-h"><h3>${esc(t)}<span class="cnt-chip${short?' short':''}">נמצאו ${found}${req!=null?' מתוך תקן '+req:''}${rep?' · '+rep+' בתיקון':''}</span></h3>${act.length?`<button class="linkbtn" data-act="allok" data-cab="${esc(t)}">כולם נמצאו</button>`:''}</div>
    ${list.map(x=>x.status==='repair'?`<div class="row s-repair"><div class="iname"><span class="devid">${esc(x.id)}</span>${loc(x)}</div><span class="pill repair">בתיקון</span></div>`:
      `<div class="row s-${d[x.id]==='found'?'ok':d[x.id]||'none'}"><div class="iname"><span class="devid">${esc(x.id)}</span>${loc(x)}</div>
      <div class="opts" role="group" aria-label="${esc(t+' '+x.id)}">${[['found','נמצא'],['missing','לא נמצא']].map(([v,l])=>`<button data-act="mark" data-id="${esc(x.id)}" data-v="${v}" aria-pressed="${d[x.id]===v}">${l}</button>`).join('')}</div></div>`).join('')}
    </section>`}).join('');
}

function orderBody(key){
  const cats=[],by={};
  S.consumables.forEach(c=>{if(!by[c.category]){by[c.category]=[];cats.push(c.category)}by[c.category].push(c)});
  return cats.map(cat=>`<section class="cab"><div class="cab-h"><h3>${esc(cat)}</h3></div>
    <div class="ohead" aria-hidden="true"><span>פריט</span><span class="num">תקן</span><span class="num">במלאי</span><span class="num">להזמנה</span></div>
    ${by[cat].map(c=>{const v=cnt[key+'|'+c.id],q=orderQty(c,v);return`<div class="orow"><div class="iname">${esc(c.name)}${infoBtn({name:c.name,barcode:c.barcode})}${c.unit?` <span class="muted">(${esc(c.unit)})</span>`:''}</div>
      <span class="num">${c.qty==null?'—':c.qty}</span>
      <input type="number" min="0" inputmode="numeric" class="stock" id="s-${esc(c.id)}" data-id="${esc(c.id)}" value="${esc(v)}" aria-label="מלאי קיים: ${esc(c.name)}">
      <span class="num toorder${q?' pos':''}" id="o-${esc(c.id)}">${q==null?'—':q}</span></div>`}).join('')}
  </section>`).join('');
}

function updateProgress(){
  const team=view,f=selFreq[team];if(!f)return;
  const key=team+'|'+f,d=draft[key]||{};let txt;
  if(f==='devices'){const act=volDevices().filter(x=>x.status==='active');const m=act.filter(x=>d[x.id]).length,miss=act.filter(x=>d[x.id]==='missing').length;txt=`${m}/${act.length} סומנו`+(miss?` · ${miss} לא נמצאו`:'')}
  else if(f==='order'){const fl=S.consumables.filter(c=>filled(cnt[key+'|'+c.id])).length,n=S.consumables.filter(c=>orderQty(c,cnt[key+'|'+c.id])>0).length;txt=`${fl}/${S.consumables.length} מולאו`+(n?` · ${n} להזמנה`:'')}
  else{const list=teamItems(team,f);const marked=list.filter(i=>d[i.id]).length,probs=list.filter(i=>d[i.id]&&d[i.id]!=='ok').length;txt=`${marked}/${list.length} סומנו`+(probs?` · ${probs} בעיות`:'')}
  $('#progress').textContent=txt;
  $('#submit').disabled=busy;$('#submit').textContent=busy?'שומר…':f==='order'?'שליחת הזמנה':'שמירת בדיקה';
}

function catFind(o){
  const b=normId(o.barcode);
  return S.catalog.find(c=>b&&(normId(c.barcode)===b||normId(c.sku)===b))||S.catalog.find(c=>o.name&&c.name.trim()===String(o.name).trim());
}
function infoBtn(o){const c=catFind(o);return c?`<button class="info" data-act="info" data-pid="${esc(c.id)}" aria-label="פרטים על ${esc(c.name)}" title="פרטים ומאיפה מביאים">i</button>`:''}
function catalogView(){
  const q=normId(st.cq),raw=st.cq.trim();
  const srcs=[...new Set(S.catalog.map(c=>c.source).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'he'));
  const list=S.catalog.filter(c=>(!st.csrc||(st.csrc==='—'?!c.source:c.source===st.csrc))&&(!raw||c.name.includes(raw)||c.desc.includes(raw)||(q&&(normId(c.sku).includes(q)||normId(c.barcode).includes(q)))))
    .sort((a,b)=>a.name.localeCompare(b.name,'he'));
  const fact=(l,v,cls)=>v?`<dt>${l}</dt><dd${cls?` class="${cls}"`:''}>${esc(v)}</dd>`:'';
  const cards=list.map(c=>`<details class="item" data-pid="${esc(c.id)}"${st.copen===c.id||(raw&&list.length===1)?' open':''}><summary><span class="nm">${esc(c.name)}</span><span class="src${c.source?'':' none'}">${esc(c.source||'לא צוין מקור')}</span></summary>
    <dl class="facts">${fact('מאיפה מביאים',c.source,'where')}${fact('איך מזמינים',c.howto)}${fact('תיאור',c.desc)}${fact('מק״ט',c.sku)}${fact('ברקוד',c.barcode)}${fact('יחידת מידה',c.unit)}${fact('מיקום בחדר',c.location)}${fact('הערות',c.notes)}</dl>
    ${c.barcode?`<div class="bcbox"><svg data-bc="${esc(c.barcode)}"></svg></div>`:''}</details>`).join('');
  const ni=st.ni;
  const addForm=S.isMgr?`<section class="panel"><h2>הוספת פריט לקטלוג</h2><p class="statusline">שדות נוספים, כמו הערות ותיקונים, עורכים בלשונית "קטלוג פריטים" בגיליון.</p>
    <div class="formrow"><input id="ni-name" placeholder="שם הפריט" value="${esc(ni.name)}"></div>
    <div class="formrow"><input id="ni-barcode" placeholder="ברקוד" value="${esc(ni.barcode)}" style="direction:ltr;text-align:right"><button class="btn ghost scan" data-act="scancatadd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>סריקה</button></div>
    <div class="formrow"><input id="ni-sku" placeholder="מק״ט" value="${esc(ni.sku)}" style="direction:ltr;text-align:right"><input id="ni-unit" placeholder="יחידת מידה (קופסה, יח׳…)" value="${esc(ni.unit)}"></div>
    <div class="formrow"><input id="ni-source" list="ni-srcs" placeholder="מאיפה מביאים" value="${esc(ni.source)}"><datalist id="ni-srcs">${srcs.map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>
      <input id="ni-location" placeholder="מיקום בחדר הטראומה" value="${esc(ni.location)}"></div>
    <div class="formcol"><textarea id="ni-desc" placeholder="תיאור הפריט">${esc(ni.desc)}</textarea><textarea id="ni-howto" placeholder="איך מזמינים / איש קשר / טלפון">${esc(ni.howto)}</textarea></div>
    <div><button class="btn" data-act="addcat">הוספה לקטלוג</button></div></section>`:'';
  return`<section class="panel"><h2>קטלוג פריטים</h2>
    <p class="statusline">כל הפריטים, ולכל אחד מאיפה מביאים אותו. לוחצים על פריט כדי לראות את כל הפרטים.</p>
    <div class="formrow"><input id="cq" placeholder="חיפוש לפי שם, מק״ט או ברקוד" value="${esc(st.cq)}"><button class="btn ghost scan" data-act="scancat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>סריקה</button></div>
    ${srcs.length?`<div class="chips" role="group" aria-label="סינון לפי מקור"><button data-act="csrc" data-v="" aria-pressed="${!st.csrc}">הכל</button>${srcs.map(x=>`<button data-act="csrc" data-v="${esc(x)}" aria-pressed="${st.csrc===x}">${esc(x)}</button>`).join('')}${S.catalog.some(c=>!c.source)?`<button data-act="csrc" data-v="—" aria-pressed="${st.csrc==='—'}">בלי מקור</button>`:''}</div>`:''}
    <p class="statusline"><b>${list.length}</b> מתוך ${S.catalog.length} פריטים</p></section>
  ${S.catalog.length?(list.length?`<div class="catlist">${cards}</div>`:`<p class="empty">לא נמצא פריט שמתאים לחיפוש.</p>`):`<div class="panel"><p class="empty">הקטלוג עדיין ריק. ${S.isMgr?'מוסיפים פריטים בטופס למטה או ישירות בגיליון, בלשונית "קטלוג פריטים".':'המנהל מוסיף פריטים בגיליון.'}</p></div>`}
  ${addForm}`;
}
function drawCatBarcodes(){
  const open=[...document.querySelectorAll('details.item[open] svg[data-bc]')];if(!open.length)return;
  loadJsBarcode().then(()=>open.forEach(el=>{if(el.dataset.done)return;el.dataset.done='1';const v=el.dataset.bc;
    try{JsBarcode(el,v,{format:bcFormat(v),height:44,width:1.7,fontSize:13,margin:0})}catch(e){el.parentNode.hidden=true}})).catch(()=>{});
}
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.item')){if(d.open){st.copen=d.dataset.pid;drawCatBarcodes()}else if(st.copen===d.dataset.pid)st.copen=''}},true);

function managerView(){
  if(!S.isMgr)return`<section class="panel"><h2>כניסת מנהל</h2>
    <p class="statusline">לוח הבקרה מציג חוסרים, תקלות ובדיקות שלא בוצעו. הקוד נמצא בגיליון "הגדרות".</p>
    <div class="pinrow"><label for="mpin" class="muted">קוד מנהל</label><input id="mpin" type="password" inputmode="numeric" autocomplete="off" value="${esc(st.mgrDraft)}"><button class="btn" data-act="login">כניסה</button></div></section>`;
  const open=S.openIssues,cs=combos(),late=cs.filter(([t,f])=>due(t,f).state!=='done');
  const banner=(open.length||late.length)?`<div class="alert"><strong>${open.length?open.length+' פריטים דורשים השלמה או תיקון':''}${open.length&&late.length?' · ':''}${late.length?late.length+' בדיקות לא בוצעו בזמן':''}</strong><span class="muted">פרטים למטה.</span></div>`:
    `<div class="alert okay"><strong>הכל תקין</strong><span class="muted">כל הבדיקות בוצעו בזמן ואין חוסרים פתוחים.</span></div>`;
  const stats=cs.length?`<div class="grid">${cs.map(([t,f])=>{const s=due(t,f);return`<div class="stat"><span class="who">${TEAM[t]} · ${FREQ[f].label}</span>
    <span class="pill ${s.state}">${s.state==='done'?'בוצעה':s.state==='never'?'טרם בוצעה':'באיחור'}</span>
    <span class="mono">${s.c?fmt(s.c.at)+' · '+esc(s.c.by):'—'}</span></div>`}).join('')}</div>`:'<p class="empty">אין עדיין פריטים ברשימה.</p>';
  const issueList=open.length?`<div class="list">${open.map(x=>`<div class="li"><div class="main"><span><b>${esc(x.itemName)}</b> <span class="pill ${x.type}">${TYPE[x.type]}</span></span>
      ${qtyLine(x)?`<span><b>${qtyLine(x)}</b></span>`:''}<span class="muted">${esc(x.cabinet)} · דווח ע"י ${esc(x.by)}${x.team?' ('+TEAM[x.team]+')':''}</span>${x.note?`<span class="muted">"${esc(x.note)}"</span>`:''}<span class="mono">${fmt(x.at)}</span></div>
      <button class="btn small" data-act="resolve" data-id="${esc(x.id)}">הושלם</button></div>`).join('')}</div>`:'<p class="empty">אין חוסרים או תקלות פתוחים.</p>';
  const days=iso=>Math.max(0,Math.floor((Date.now()-new Date(iso))/864e5));
  const repList=S.repairs.length?`<div class="list">${S.repairs.map(r=>`<div class="li"><div class="main"><span><b>${esc(r.type)}</b> <span class="devid">${esc(r.id)}</span></span>
      ${r.reason?`<span>${esc(r.reason)}</span>`:''}<span class="mono">נשלח ${fmt(r.sentAt)} · ${days(r.sentAt)} ימים בתיקון · תקלה מס׳ ${(S.repairHistory[r.id]||[]).length||1}</span></div>

document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.view;store.set('view',view);render();window.scrollTo(0,0)});
document.getElementById('main').addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='checker'){st.name=t.value;store.set('checker',st.name)}
  else if(t.id==='note')st.note=t.value;
  else if(t.id==='spin')st.pinDraft=t.value;
  else if(t.id==='mpin')st.mgrDraft=t.value;
  else if(t.id==='rdev'){st.rdev=t.value;const a=document.activeElement;if(a)a.blur();render()}
  else if(t.id==='rreason')st.rreason=t.value;
  else if(t.id==='hq'){st.hq=t.value;clearTimeout(window.__hqT);window.__hqT=setTimeout(()=>{const pos=t.selectionStart;render();const el=$('#hq');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}},400)}
  else if(t.id==='rq'){st.rq=t.value;clearTimeout(window.__rqT);window.__rqT=setTimeout(()=>{const pos=t.selectionStart;render();const el=$('#rq');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}},400)}
  else if(t.dataset&&t.dataset.rn)st.rnote[t.dataset.rn]=t.value;
  else if(t.id==='cq'){st.cq=t.value;clearTimeout(window.__cqT);window.__cqT=setTimeout(()=>{const pos=t.selectionStart;render();const el=$('#cq');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}},350)}
  else if(t.id&&t.id.startsWith('ni-'))st.ni[t.id.slice(3)]=t.value;
  else if(t.id&&t.id.startsWith('nd-')){const k=t.id.slice(3);st.nd[k]=t.type==='checkbox'?t.checked:t.value}
  else if(t.classList.contains('cnt'))cnt[view+'|'+selFreq[view]+'|'+t.dataset.id]=t.value;
  else if(t.classList.contains('stock')){
    const key=view+'|'+selFreq[view];cnt[key+'|'+t.dataset.id]=t.value;
    const c=S.consumables.find(x=>x.id===t.dataset.id),o=document.getElementById('o-'+t.dataset.id);
    if(c&&o){const q=orderQty(c,t.value);o.textContent=q==null?'—':q;o.classList.toggle('pos',q>0)}
    updateProgress();
  }
});
document.getElementById('main').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mpin'){e.preventDefault();login()}});

async function login(){
  const pin=st.mgrDraft.trim();if(!pin){toast('יש להזין קוד מנהל','err');return}
  try{
    const r=await api('verifyPin',pin);
    if(r!=='manager'){toast('קוד המנהל שגוי','err');return}
    mgrPin=pin;store.set('mgrPin',pin);st.mgrDraft='';
    document.activeElement&&document.activeElement.blur();
    apply(await api('getState',mgrPin));
  }catch(err){toast(cleanErr(err),'err')}
}

document.getElementById('main').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='freq'){selFreq[view]=b.dataset.f;render();return}
  if(act==='mark'||act==='allok'){
    const key=view+'|'+selFreq[view];draft[key]=draft[key]||{};
    if(act==='mark'){const cur=draft[key][b.dataset.id];draft[key][b.dataset.id]=cur===b.dataset.v?undefined:b.dataset.v}
    else if(selFreq[view]==='devices')volDevices().filter(x=>x.status==='active'&&x.type===b.dataset.cab).forEach(x=>{if(!draft[key][x.id])draft[key][x.id]='found'});
    else teamItems(view,selFreq[view]).filter(i=>i.cabinet===b.dataset.cab).forEach(i=>{if(!draft[key][i.id])draft[key][i.id]='ok'});
    const y=window.scrollY;render();window.scrollTo(0,y);return;
  }
  if(act==='forgetpin'){staffPin='';store.set('staffPin','');render();return}
  if(act==='reload'){b.disabled=true;await refresh();b.disabled=false;toast('עודכן');return}
  if(act==='login'){login();return}
  if(act==='logout'){mgrPin='';store.set('mgrPin','');S.isMgr=false;S.openIssues=[];render();return}
  if(act==='printorder'){printOrder(S.lastOrder);return}
  if(act==='info'){view='catalog';store.set('view',view);st.cq='';st.csrc='';st.copen=b.dataset.pid;render();const el=document.querySelector(`details.item[data-pid="${CSS.escape(b.dataset.pid)}"]`);if(el)el.scrollIntoView({block:'center'});return}
  if(act==='csrc'){st.csrc=b.dataset.v;render();return}
  if(act==='scancat'){openScanner('catlookup');return}
  if(act==='scancatadd'){openScanner('catadd');return}
  if(act==='addcat'){
    if(!st.ni.name.trim()){toast('יש להזין שם פריט','err');return}
    b.disabled=true;try{apply(await api('addCatalogItem',mgrPin,Object.assign({},st.ni)));toast(`${st.ni.name} נוסף לקטלוג`);st.ni={name:'',sku:'',barcode:'',unit:st.ni.unit,source:st.ni.source,desc:'',howto:st.ni.howto,location:''};render()}catch(err){b.disabled=false;toast(cleanErr(err),'err')}return}
  if(act==='scan'){openScanner('check');return}
  if(act==='scanadd'){openScanner('add');return}
  if(act==='scanlookup'){openScanner('lookup');return}
  if(act==='scanrepair'){openScanner('repair');return}
  if(act==='adddev'){
    const nd=st.nd;if(!nd.id.trim()){toast('יש להזין או לסרוק מספר זיהוי','err');return}if(!nd.type.trim()){toast('יש לבחור סוג מכשיר','err');return}
    b.disabled=true;try{apply(await api('addDevice',mgrPin,{id:nd.id,type:nd.type,location:nd.loc,vol:nd.vol,clean:nd.clean}));
      toast(`${nd.type} ${nd.id} נוסף למאגר`);st.nd={id:'',type:nd.type,loc:nd.loc,vol:nd.vol,clean:nd.clean};render()}catch(err){b.disabled=false;toast(cleanErr(err),'err')}return}
  if(act==='send'){
    const id=st.rdev||($('#rdev')&&$('#rdev').value);if(!id){toast('יש לבחור מכשיר','err');return}
    if(!st.rreason.trim()){toast('יש לכתוב מה התקלה','err');const el=$('#rreason');if(el)el.focus();return}
    b.disabled=true;try{apply(await api('sendToRepair',mgrPin,id,st.rreason));st.rdev='';st.rreason='';render();toast('המכשיר סומן כבתיקון')}catch(err){b.disabled=false;toast(cleanErr(err),'err')}return}
  if(act==='ret'){b.disabled=true;try{apply(await api('returnFromRepair',mgrPin,b.dataset.id,st.rnote[b.dataset.id]||''));delete st.rnote[b.dataset.id];toast('המכשיר חזר לפעילות')}catch(err){b.disabled=false;toast(cleanErr(err),'err')}return}
  if(act==='resolve'){b.disabled=true;try{apply(await api('resolveIssue',mgrPin,b.dataset.id));toast('סומן כהושלם')}catch(err){b.disabled=false;toast(cleanErr(err),'err')}}
});

document.getElementById('submit').addEventListener('click',async()=>{
  const team=view,f=selFreq[team];if(!f||busy)return;
  const key=team+'|'+f,d=draft[key]||{},name=st.name.trim();
  if(!name){toast('יש להזין שם בודק/ת','err');const el=$('#checker');if(el)el.focus();return}
  const pin=staffPin||mgrPin||st.pinDraft.trim();
  if(!pin){toast('יש להזין קוד מחלקה','err');const el=$('#spin');if(el)el.focus();return}
  let action,payload,okMsg;
  const base={pin,mgrPin:mgrPin||'',by:name,notes:st.note};
  if(f==='devices'){
    const act=volDevices().filter(x=>x.status==='active'),left=act.filter(x=>!d[x.id]).length;
    if(left){toast(`נשארו ${left} מכשירים לא מסומנים`,'err');return}
    const results={};act.forEach(x=>results[x.id]=d[x.id]);
    const miss=act.filter(x=>d[x.id]==='missing').length;
    action='submitDeviceCheck';payload=Object.assign(base,{results});
    okMsg=miss?`הבדיקה נשמרה. ${miss} מכשירים שלא נמצאו דווחו למנהל`:'הבדיקה נשמרה. כל המכשירים נמצאו';
  }else if(f==='order'){
    const left=S.consumables.filter(c=>!filled(cnt[key+'|'+c.id])).length;
    if(left){toast(`נשארו ${left} פריטים בלי כמות במלאי`,'err');return}
    const stock={};S.consumables.forEach(c=>stock[c.id]=Math.max(0,Math.round(Number(cnt[key+'|'+c.id]))));
    const n=S.consumables.filter(c=>orderQty(c,stock[c.id])>0).length;
    action='submitOrder';payload=Object.assign(base,{stock});
    okMsg=n?`ההזמנה נשלחה. ${n} פריטים להזמנה`:'נשמר. אין צורך להזמין השבוע';
  }else{
    const list=teamItems(team,f),left=list.filter(i=>!d[i.id]).length;
    if(left){toast(`נשארו ${left} פריטים לא מסומנים`,'err');return}
    const results={},found={};
    list.forEach(i=>{results[i.id]=d[i.id];const v=cnt[key+'|'+i.id];if(d[i.id]==='missing'&&filled(v))found[i.id]=Number(v)});
    const probs=list.filter(i=>d[i.id]!=='ok').length;
    action='submitCheck';payload=Object.assign(base,{team,freq:f,results,found});
    okMsg=probs?`הבדיקה נשמרה. ${probs} דיווחים נשלחו למנהל`:'הבדיקה נשמרה. הכל תקין';
  }
  busy=true;updateProgress();
  try{
    const s=await api(action,payload);
    if(!staffPin&&!mgrPin){staffPin=pin;store.set('staffPin',pin)}
    st.pinDraft='';draft[key]={};st.note='';Object.keys(cnt).forEach(k=>{if(k.startsWith(key+'|'))delete cnt[k]});
    busy=false;apply(s);render();window.scrollTo(0,0);
    toast(okMsg);
  }catch(err){
    busy=false;const m=cleanErr(err);
    if(/קוד/.test(m)&&staffPin){staffPin='';store.set('staffPin','');render()}
    updateProgress();toast(m,'err');
  }
});

/* ---------- printable order with barcodes ---------- */
let jbP=null;
function loadJsBarcode(){
  if(window.JsBarcode)return Promise.resolve();
  if(!jbP)jbP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='vendor/JsBarcode.all.min.js';sc.onload=res;sc.onerror=()=>{jbP=null;rej(new Error('טעינת רכיב הברקוד נכשלה. בדוק/י אינטרנט.'))};document.head.appendChild(sc)});
  return jbP;
}
function eanOk(d){const a=d.split('').map(Number),c=a.pop();const s=a.reverse().reduce((t,n,i)=>t+n*(i%2?1:3),0);return (10-s%10)%10===c}
function bcFormat(code){if(/^\d{13}$/.test(code)&&eanOk(code))return'EAN13';if(/^\d{8}$/.test(code)&&eanOk(code))return'EAN8';return'CODE128'}
async function printOrder(lo){
  if(!lo)return;
  const lines=lo.lines.filter(l=>l.order>0);
  try{await loadJsBarcode()}catch(e){toast(cleanErr(e),'err');return}
  const pr=$('#print');
  pr.innerHTML=`<h1>הזמנה שבועית – ${esc(S.unit||'חדר טראומה')}</h1>
    <p class="meta">מולאה ${fmt(lo.at)} ע"י ${esc(lo.by)} · ${lines.length} פריטים להזמנה · הודפס ${fmt(new Date().toISOString())}</p>
    <table><thead><tr><th></th><th>פריט</th><th>להזמנה</th><th>יחידה</th><th>ברקוד</th></tr></thead><tbody>
    ${lines.map((l,i)=>`<tr><td class="box"><span></span></td><td><b>${esc(l.name)}</b><br><span style="font-size:9pt;color:#444">${esc(l.category)} · תקן ${l.qty==null?'—':l.qty} · במלאי ${l.stock==null?'—':l.stock}</span></td>
      <td class="q">${l.order}</td><td>${esc(l.unit)}</td><td class="bc">${l.barcode?`<svg id="bc-${i}"></svg>`:'<span class="nobc">אין ברקוד</span>'}</td></tr>`).join('')}
    </tbody></table><p class="foot">סורקים את הברקוד במערכת ההזמנות, מקלידים את הכמות ומסמנים V בריבוע.</p>`;
  lines.forEach((l,i)=>{if(!l.barcode)return;const el=document.getElementById('bc-'+i);
    try{JsBarcode(el,l.barcode,{format:bcFormat(l.barcode),height:40,width:1.6,fontSize:13,margin:0,textMargin:1})}
    catch(e){el.outerHTML=`<span class="nobc">${esc(l.barcode)} (לא ניתן להמיר לברקוד)</span>`}});
  setTimeout(()=>window.print(),50);
}

/* ---------- barcode scanner ---------- */
const normId=v=>String(v||'').replace(/[^0-9A-Za-z\u0590-\u05FF]/g,'').toUpperCase();
let scanner=null,scanMode=null,lastCode='',lastAt=0,libP=null;
function loadLib(){
  if(window.Html5Qrcode)return Promise.resolve();
  if(!libP)libP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='vendor/html5-qrcode.min.js';sc.onload=res;sc.onerror=()=>{libP=null;rej(new Error('טעינת הסורק נכשלה. בדוק/י אינטרנט.'))};document.head.appendChild(sc)});
  return libP;
}
function scanMsg(text,kind){const m=$('#scanmsg');m.textContent=text;m.className='scanmsg'+(kind?' '+kind:'')}
function scanCount(){
  if(scanMode!=='check'){$('#scancount').textContent='';return}
  const d=draft['volunteers|devices']||{},act=volDevices().filter(x=>x.status==='active');
  $('#scancount').textContent=`נסרקו ${act.filter(x=>d[x.id]==='found').length} מתוך ${act.length} מכשירים`;
}
async function openScanner(mode){
  scanMode=mode;lastCode='';
  $('#scanov').hidden=false;$('#scanmanual').value='';
  $('#scantitle').textContent={add:'סריקת מכשיר חדש',lookup:'חיפוש מכשיר',repair:'מכשיר לתיקון',catlookup:'חיפוש פריט',catadd:'ברקוד של פריט חדש'}[mode]||'סריקת מכשירים';
  scanMsg('מכוונים את המצלמה לברקוד שעל המדבקה.');scanCount();
  try{
    await loadLib();
    const F=Html5QrcodeSupportedFormats;
    scanner=new Html5Qrcode('reader',{verbose:false,formatsToSupport:[F.CODE_128,F.CODE_39,F.CODE_93,F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.ITF,F.CODABAR,F.QR_CODE,F.DATA_MATRIX],experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.floor(Math.min(w*.9,360)),height:Math.floor(Math.min(h*.45,180))})},onCode,()=>{});
  }catch(e){
    const m=String((e&&e.message)||e||'');
    scanMsg(/Permission|NotAllowed/i.test(m)?'אין הרשאה למצלמה. מאשרים גישה למצלמה בהגדרות הדפדפן, או מקלידים את המספר למטה.':(m.includes('טעינת')?m:'לא הצלחתי לפתוח את המצלמה. אפשר להקליד את המספר למטה.'),'bad');
  }
}
async function closeScanner(){
  const s=scanner;scanner=null;
  if(s){try{await s.stop()}catch(e){}try{s.clear()}catch(e){}}
  $('#scanov').hidden=true;$('#reader').innerHTML='';
  if(scanMode==='check'){const y=window.scrollY;render();window.scrollTo(0,y)}
  scanMode=null;
}
function onCode(text){
  const code=normId(text),now=Date.now();
  if(!code||(code===lastCode&&now-lastAt<2500))return;
  lastCode=code;lastAt=now;
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  handleCode(code,text.trim());
}
function handleCode(code,raw){
  const dev=S.devices.find(x=>normId(x.id)===code);
  if(scanMode==='catlookup'){const c=catFind({barcode:raw});st.cq=c?'':raw;st.csrc='';st.copen=c?c.id:'';closeScanner().then(()=>{render();if(c){const el=document.querySelector(`details.item[data-pid="${CSS.escape(c.id)}"]`);if(el)el.scrollIntoView({block:'center'})}else toast('לא נמצא פריט עם הברקוד '+raw,'err')});return}
  if(scanMode==='catadd'){const c=catFind({barcode:raw});if(c){scanMsg('הפריט כבר בקטלוג: '+c.name,'warn');return}st.ni.barcode=raw.replace(/\s+/g,'');closeScanner().then(()=>{render();const el=$('#ni-name');if(el)el.focus()});return}
  if(scanMode==='lookup'){st.hq=dev?dev.id:raw;closeScanner().then(()=>{render();const el=$('#histsec');if(el)el.scrollIntoView({block:'start'})});return}
  if(scanMode==='repair'){
    if(!dev){scanMsg('ברקוד לא מוכר: '+raw+'. המכשיר לא נמצא ברשימה.','bad');return}
    if(dev.status==='repair'){scanMsg(`${dev.type} ${dev.id} כבר מסומן כבתיקון.`,'warn');return}
    st.rdev=dev.id;closeScanner().then(()=>{render();const el=$('#rreason');if(el){el.scrollIntoView({block:'center'});el.focus()}});return}
  if(scanMode==='add'){
    if(dev){scanMsg(`המכשיר כבר קיים: ${dev.type} ${dev.id}${dev.status==='repair'?' (בתיקון)':''}`,'warn');st.rdev=dev.status==='active'?dev.id:st.rdev;return}
    st.nd.id=raw.replace(/\s+/g,'');closeScanner().then(()=>{render();toast('נסרק: '+st.nd.id+'. בוחרים סוג ומוסיפים.');const el=$('#nd-type');if(el)el.focus()});
    return;
  }
  if(!dev){scanMsg('ברקוד לא מוכר: '+raw+'. המכשיר לא נמצא ברשימה.','bad');return}
  if(!dev.vol){scanMsg(`${dev.type} ${dev.id} לא נמצא בצ׳קליסט של בנות השירות.`,'warn');return}
  if(dev.status==='repair'){scanMsg(`${dev.type} ${dev.id} מסומן כבתיקון.`,'warn');return}
  const key='volunteers|devices';draft[key]=draft[key]||{};
  const already=draft[key][dev.id]==='found';draft[key][dev.id]='found';
  scanMsg(`✓ ${dev.type} ${dev.id}${dev.location?' · '+dev.location:''}${already?' (כבר סומן)':' נמצא'}`,'ok');
  scanCount();updateProgress();
}
$('#scanclose').addEventListener('click',closeScanner);
$('#scanmanbtn').addEventListener('click',()=>{const v=$('#scanmanual').value;if(!v.trim())return;lastCode='';handleCode(normId(v),v.trim());$('#scanmanual').value=''});
$('#scanmanual').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#scanmanbtn').click()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scanov').hidden)closeScanner()});

setInterval(()=>{if(document.visibilityState==='visible'&&!busy&&$('#scanov').hidden)refresh()},90000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.loaded)refresh()});
render();refresh();
</script>
